[project]
name = "gabriel"
version = "0.1.0"
description = "Gabriel: Seraph's voice (radio agent on crew, one call agent per call)"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[gladia,elevenlabs,openai,silero]~=1.8",
    "livekit-api",
    "websockets>=13",
    "aiohttp",
    "numpy",
]

[project.scripts]
gabriel-radio = "gabriel.radio:main"
gabriel-calls = "gabriel.calls:main"
gabriel-mock = "gabriel.mock:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gabriel"]
