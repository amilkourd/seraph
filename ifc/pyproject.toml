[project]
name = "seraph-ifc"
version = "1.0.0"
description = "Seraph building model: any IFC → building.json (route graph in metres, rooms, doors, stairs, materials), level plans, checks"
requires-python = ">=3.12"
dependencies = [
  "ifcopenshell>=0.8",
  "numpy>=1.26",
  "shapely>=2.0",
  "pyyaml>=6.0",
]

[project.scripts]
ifc-author = "seraph_ifc.author:main"
ifc-extract = "seraph_ifc.extract:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seraph_ifc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
