# Dev building: the fictional R+5 of docs/02-scenario.md and contracts/fixtures/building.json.
# Read by seraph_ifc/author.py → ifc/dev/dev.ifc. Metres. x east, y north. Footprint 26.4 × 20.4 m.
# Laid out so that the level-3 zones extracted into the 0–1000 plan frame fall on the fixture's plan
# (contracts/fixtures/plan-level3.svg): stair A top left, stair B bottom right, corridor across the middle.
#
# Rooms tile each level (shared edges): walls are generated on room edges, one wall per shared edge.
# Materials and fire ratings: only the ones written here. This building is fictional, so this file is the source.

building:
  name: "Bâtiment d'exercice"
  provenance: fictional
  provenance_fr: "Bâtiment fictif — maquette IFC d'exercice"
  method: "authored from trace.yaml (seraph_ifc/author.py)"
  from: "docs/02-scenario.md, contracts/fixtures/building.json"
  north: "+y"            # plan north; the front façade (boulevard) is the south one
  front: south

storey_height: 3.0
wall_thickness: 0.2
slab_thickness: 0.2

levels:
  - {level: 0, name: "RDC", elevation: 0.0}
  - {level: 1, name: "R+1", elevation: 3.0}
  - {level: 2, name: "R+2", elevation: 6.0}
  - {level: 3, name: "R+3", elevation: 9.0}
  - {level: 4, name: "R+4", elevation: 12.0}
  - {level: 5, name: "R+5", elevation: 15.0}

# What the walls and slabs are made of. Keys are used below (`enclosure`) and by the wall classifier:
# facade = wall on the outer edge, stair = wall of a stair space, partition = any other inside wall.
materials:
  facade: {material: "Pierre de taille"}
  stair: {material: "Béton armé", fire_rating: "REI 60"}
  partition: {material: "Plaque de plâtre sur ossature métallique"}
  technical: {material: "Bloc béton", fire_rating: "EI 60"}
  slab: {material: "Béton armé", fire_rating: "REI 60"}

# Spaces present on every level. `{n}` = level number. `stair: A` marks a stair space (one stair across levels).
core:
  spaces:
    - {name: "A", long_name: "Escalier A (nord)", use: "escalier", stair: A,
       polygon: [[0, 14.4], [4.2, 14.4], [4.2, 20.4], [0, 20.4]]}
    - {name: "{n}.ASC", long_name: "Ascenseur", use: "ascenseur",
       polygon: [[0, 11.4], [2.1, 11.4], [2.1, 14.4], [0, 14.4]]}
    - {name: "{n}.C", long_name: "Circulation", use: "circulation",
       polygon: [[0, 8.4], [26.4, 8.4], [26.4, 11.4], [4.2, 11.4], [4.2, 14.4], [2.1, 14.4], [2.1, 11.4], [0, 11.4]]}
    - {name: "B", long_name: "Escalier B (sud)", use: "escalier", stair: B,
       polygon: [[22.2, 0], [26.4, 0], [26.4, 8.4], [22.2, 8.4]]}
  doors:
    - {name: "P-A-{n}", at: [3.15, 14.4], width: 1.0, fire_rating: "EI 30"}     # stair A ↔ corridor
    - {name: "P-ASC-{n}", at: [2.1, 12.9], width: 1.0}                          # elevator ↔ corridor
    - {name: "P-B-{n}", at: [24.3, 8.4], width: 1.0, fire_rating: "EI 30"}      # stair B ↔ corridor

