<!doctype html>
<html lang="fr" data-view-id="view_approach_3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>approach</title>
<link rel="stylesheet" href="{{HALO_KIT_URL}}/halo.css">
<script src="{{HALO_KIT_URL}}/halo-kit.js"></script>
</head>
<body>
<script>
/* Moment « approach » — « Par où j'entre ». One idea, one big shape: the arrow from the street onto the entrance
 * to take. Top view, outside only: the footprint white (where we go), the street band along the façade edge the
 * chosen door opens on, the entrances of this frame, the arrow. One frame only, the model's ground-floor frame
 * (levels[RDC].outline, else the hull of the RDC rooms): entrances, truck and hydrant are drawn only when their
 * point is on that frame; the others become words in the card. The stair and the fire stay in the card.
 * The entrance tag sits across the arrow, never on its shaft or head. */
const f = Halo.frame(document.body, { title: "Par où j'entre" });
const B = { x: 185, y: 116, w: 270, h: 170 };      // schematic building, scene units (no model)
let mode = '';

function sideDoor(e, i, n) {
  const t = (i + 1) / (n + 1);
  return { front: [B.x + B.w * t, B.y + B.h], rear: [B.x + B.w * t, B.y], left: [B.x, B.y + B.h * t], right: [B.x + B.w, B.y + B.h * t] }[e.side];
}
// an entrance not to take: blocked, or opening onto a stair / room in smoke or fire
function badEntrance(b, e) {
  if (e.status === 'blocked' || e.status === 'locked') return true;
  const parts = (e.leads_to || '').split(':');
  if (parts[0] === 'stair') return smoky(b, parts[1]);
  return b.hazards.some(h => (h.where.room && 'room:' + h.where.room === e.leads_to) || (h.where.entrance === e.id));
}
function smoky(b, id) {
  const st = Halo.byId(b.stairs, id);
  return !!st && (st.status === 'smoke' || st.status === 'blocked' || b.hazards.some(h => h.kind === 'smoke' && h.where.stair === id));
}
// how far a point can travel along u before leaving the drawing area
function span(c, u) {
  const A = Halo.AREA, m = 8;
  const lim = (p, d, lo, hi) => d === 0 ? 1e4 : d > 0 ? (hi - p) / d : (lo - p) / d;
  return Math.max(0, Math.min(lim(c.x, u.x, A.x + m, A.x + A.w - m), lim(c.y, u.y, A.y + m, A.y + A.h - m)));
}

function draw(s) {
  f.clear();
  const b = s.building, ifc = !!b.model;
  if ((ifc ? 'ifc' : 'schematic') !== mode) { mode = ifc ? 'ifc' : 'schematic'; Halo.scene(f.svg, ifc ? {} : { rotate: -45, cx: 300 }); }
  const best = Halo.byId(b.entrances, b.approach && b.approach.best_entrance_id);

  // the footprint and the doors, on one frame: the ground floor of the model
  let foot, door = {}, frame = null, rings = [];
  if (ifc) {
    const lvl = b.levels.find(l => l.level === 0) || {};
    const plans = (b.model.level_plans || []).find(p => p.level === 0);
    frame = plans ? plans.image_id : null;
    rings = (lvl.outline || []).map(x => x && x.outer ? x.outer : x).filter(r => Array.isArray(r) && r.length >= 3);
    const size = r => { const a = Halo.area(r).box; return a.w * a.h; };
    rings.sort((x, y) => size(y) - size(x));
    foot = rings[0] || Halo.hull(b.rooms.filter(r => r.level === 0 && r.zone).flatMap(r => r.zone));
    b.entrances.forEach(e => { if (e.plan_point && e.plan_point.image_id === frame) door[e.id] = [e.plan_point.x, e.plan_point.y]; });
  } else {
    foot = [[B.x, B.y], [B.x + B.w, B.y], [B.x + B.w, B.y + B.h], [B.x, B.y + B.h]];
    const sides = [...new Set(b.entrances.map(e => e.side))];
    sides.forEach(side => b.entrances.filter(e => e.side === side).forEach((e, i, all) => { door[e.id] = sideDoor(e, i, all.length); }));
  }
  if (!foot || foot.length < 3) { card(s, best, null, null); return; }
  const c = Halo.centroid(foot);

  // the arrow: from the street, straight onto the chosen door, away from the building's centre
  let start = null, out = null;
  if (best && door[best.id]) {
    const d = door[best.id], dx = d[0] - c.x, dy = d[1] - c.y, l = Math.hypot(dx, dy) || 1;
    out = { x: dx / l, y: dy / l };
    start = [d[0] + out.x * (ifc ? 330 : 160), d[1] + out.y * (ifc ? 330 : 160)];
  }
  const sameFrame = p => !!p && !!frame && p.image_id === frame;
  const truck = b.truck_spot && sameFrame(b.truck_spot.point) ? [b.truck_spot.point.x, b.truck_spot.point.y] : null;
  const pei = (b.hydrants || []).find(h => sameFrame(h.point));

  const P = ifc
    ? Halo.plan(f.svg, { box: Halo.AREA, frame: false, zones: [foot].concat(rings.slice(1)).map((z, i) => ({ id: 'building' + i, zone: z, state: 'target' })),
        points: Object.values(door).concat(start ? [start] : [], truck ? [truck] : []) }).project
    : (p => ({ x: p[0], y: p[1] }));
  if (!ifc) Halo.block(f.svg, foot, { state: 'target' });

  // the street: the band the arrow comes from, across the façade edge the chosen door opens on
  if (start && out) {
    const o = P(start), d = P(door[best.id]);
    const u = { x: d.x - o.x, y: d.y - o.y }, m = Math.hypot(u.x, u.y) || 1, t = { x: -u.y / m, y: u.x / m };
    const a = span(o, t), z = span(o, { x: -t.x, y: -t.y });
    Halo.street(f.svg, { from: [o.x - t.x * z, o.y - t.y * z], to: [o.x + t.x * a, o.y + t.y * a], width: 54 });
  }

  if (start) Halo.arrow(f.svg, [start, door[best.id]].map(P), { width: 18, gap: 34, speed: 60, radius: 26 });
  if (truck) Halo.marker(f.svg, 'truck', P(truck), null, { r: 18 });
  if (pei) Halo.marker(f.svg, 'hydrant', P([pei.point.x, pei.point.y]), null, { r: 16 });

  // entrances: the chosen one big and pinged, the others dimmed; its tag across the arrow, never on it
  const across = out ? (Math.abs(out.y) > Math.abs(out.x) ? (out.x >= 0 ? 'e' : 'w') : (out.y >= 0 ? 's' : 'n')) : 'e';
  b.entrances.filter(e => door[e.id]).slice(0, 3).forEach(e => {
    const chosen = best && e.id === best.id, bad = badEntrance(b, e);
    Halo.marker(f.svg, 'door', P(door[e.id]), e.id, {
      r: chosen ? 24 : 15, big: chosen, ping: chosen, crossed: !chosen && bad, tone: chosen ? 'ink' : 'dim',
      at: chosen ? across : 'e', tap: { kind: 'entrance', id: e.id } });
  });

  card(s, best, pei, truck);
}

// the card: the key line, the stair, the fire, then what stays outside the drawn frame
function card(s, best, pei, truck) {
  if (!best) return;
  const b = s.building;
  const route = (s.routes || []).find(r => r.purpose === 'approach');
  const stairId = route && (route.via.find(n => n.indexOf('stair:') === 0) || '').split(':')[1];
  const fire = b.hazards.find(h => h.kind === 'fire');
  const h1 = (b.hydrants || [])[0];
  const spot = b.truck_spot && !truck && /E[0-9]/.test(b.truck_spot.label || '') ? (b.truck_spot.label.match(/E[0-9]/) || [])[0] : null;
  f.panel([
    { text: 'Entrez par ' + best.id },
    stairId && (smoky(b, stairId) ? { tone: 'warn', text: 'Esc. ' + stairId + ' fumée' } : { text: 'Montez esc. ' + stairId }),
    fire && { tone: 'fire', text: 'Feu ' + Halo.levelLabel(s, fire.where.level) },
    !pei && h1 && h1.distance_m ? { tone: 'water', text: 'PEI ' + h1.distance_m + ' m' }
      : spot ? { tone: 'dim', text: 'Camion vers ' + spot } : null
  ]);
}

Halo.onState(draw);
Halo.ready();
</script>
</body>
</html>
