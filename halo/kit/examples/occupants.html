<!doctype html>
<html lang="fr" data-view-id="view_occupants_example">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>occupants</title>
<link rel="stylesheet" href="{{HALO_KIT_URL}}/halo.css">
<script src="{{HALO_KIT_URL}}/halo-kit.js"></script>
</head>
<body>
<script>
/* Moment « occupants » — « Qui est où ». Side section full screen: one band per level, stair shafts at the sides,
 * people on their level. Green = people, red ring blinking = needs help, grey ? = no news, amber arrow = heading into
 * smoke. The level of the rescue route is lit. A person's x comes from their room on the level plan when there is
 * one; otherwise people share the band. */
const f = Halo.frame(document.body, { title: 'Qui est où' });
const URGENT = o => o.status === 'needs_help' || o.status === 'trapped';
const UNKNOWN = o => o.status === 'no_answer' || o.status === 'unknown' || o.status === 'calling';

function draw(s) {
  f.clear();
  const b = s.building, occ = (s.occupants || []).filter(o => o.status !== 'safe_outside');
  const rescue = (s.routes || []).find(r => r.purpose === 'to_victim');
  const stack = Halo.floorStack(f.svg, {
    box: { x: Halo.AREA.x + 70, y: 12, w: Halo.AREA.w - 70, h: 344 },   // level tags on the left, card on the right
    levels: b.levels,
    highlight: rescue ? +String(rescue.from).split(':')[1] : null,
    stairs: b.stairs.map((st, i) => ({ id: st.id, side: i ? 'right' : 'left', status: st.status, source: st.source }))
  });

  const pts = (b.plan && b.plan.points) || [];
  const xs = b.rooms.flatMap(r => (r.zone || []).map(p => p[0])).concat(pts.map(p => p.point.x));
  const x0 = Math.min(...xs) - 40, x1 = Math.max(...xs) + 40;
  const toX = (x, band) => band.x + (x - x0) / (x1 - x0) * band.w;
  const roomX = (room, band) => {
    const r = b.rooms.find(q => q.id === room), p = pts.find(q => q.name === 'room:' + room);
    const x = r && r.zone ? (Math.min(...r.zone.map(q => q[0])) + Math.max(...r.zone.map(q => q[0]))) / 2 : p ? p.point.x : null;
    return x === null ? null : toX(x, band);
  };

  b.hazards.forEach(h => {
    const band = h.where.level !== undefined && stack.band(h.where.level);
    if (!band) return;
    const r = b.rooms.find(q => q.id === h.where.room);
    if (h.kind === 'fire' && r && r.zone) {
      const xa = toX(Math.min(...r.zone.map(q => q[0])), band), xb = toX(Math.max(...r.zone.map(q => q[0])), band);
      Halo.fire(f.svg, { x: xa, y: band.y + 2, w: xb - xa, h: band.h - 4 });
    } else if (h.kind === 'smoke') {
      Halo.smoke(f.svg, { cx: h.where.room === 'corridor' ? band.cx : roomX(h.where.room, band) || band.cx, cy: band.cy, r: band.h * 0.95 });
    }
  });

  b.levels.forEach(lv => {
    const band = stack.band(lv.level), here = occ.filter(o => o.level === lv.level);
    const free = here.filter(o => roomX(o.room, band) === null);
    here.forEach(o => {
      let x = roomX(o.room, band);
      if (x === null) x = band.x + band.w * (free.indexOf(o) + 1) / (free.length + 1);
      const p = { x: x, y: band.cy };
      const into = o.heading_to && b.stairs.find(st => 'stair:' + st.id === o.heading_to);
      const bad = into && into.status !== 'clear';
      if (into) {
        const shaft = stack.shaft(into.id), tx = shaft.x > x ? shaft.x - 4 : shaft.x + shaft.w + 4;
        Halo.arrow(f.svg, [{ x: x + (tx > x ? 18 : -18), y: p.y }, { x: tx, y: p.y }], { tone: bad ? 'warn' : 'life', width: 5, ping: false, speed: 40 });
      }
      Halo.marker(f.svg, UNKNOWN(o) ? 'unknown' : o.mobility_issue ? 'wheelchair' : 'person', p, o.people_count > 1 ? o.people_count : null, {
        tone: UNKNOWN(o) ? 'dim' : bad ? 'warn' : 'life', ring: URGENT(o) ? 'fire' : null, ping: URGENT(o), blink: URGENT(o) ? 'fast' : false,
        r: 15, source: o.source, tap: { kind: 'occupant', id: o.id } });
    });
    (s.crew.teams || []).filter(t => t.status === 'engaged' && t.location && t.location.level === lv.level).forEach(t => {
      const x = (t.location.room === 'corridor' ? band.cx : roomX(t.location.room, band)) || band.cx;
      Halo.marker(f.svg, 'team', { x: x, y: band.cy }, t.id, { r: 15, tap: { kind: 'team', id: t.id } });
    });
  });

  // the card: how many inside, then who needs a decision
  const n = occ.reduce((k, o) => k + (o.people_count || 1), 0);
  const smoky = o => o.heading_to && b.stairs.find(st => 'stair:' + st.id === o.heading_to && st.status !== 'clear');
  f.panel([
    { tone: 'life', text: n + ' dedans' },
    ...occ.filter(URGENT).map(o => ({ tone: 'fire', blink: true, text: o.room + (o.mobility_issue ? ' PMR' : ' à sortir') })),
    ...occ.filter(smoky).map(o => ({ tone: 'warn', text: o.room + ' → esc. ' + o.heading_to.split(':')[1] })),
    ...occ.filter(UNKNOWN).map(o => ({ tone: 'dim', text: o.room + ' ?' }))
  ]);
}

Halo.onState(draw);
Halo.ready();
</script>
</body>
</html>
