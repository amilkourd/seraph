<!doctype html>
<html lang="fr" data-view-id="view_inside_route_example">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>inside_route</title>
<link rel="stylesheet" href="{{HALO_KIT_URL}}/halo.css">
<script src="{{HALO_KIT_URL}}/halo-kit.js"></script>
</head>
<body>
<script>
/* Moment « inside_route » — « Par où je monte ». The level plan full height, the victim's room lit, fire and smoke
 * where the state puts them, the route arrow. Everything is on the plan's 0–1000 frame. The route follows
 * routes[].path when Seraph gives one, else its `via` nodes joined along the corridor. */
const f = Halo.frame(document.body, { title: 'Par où je monte' });
const TONE = { sheltering: 'life', trapped: 'fire', needs_help: 'fire', moving: 'life', no_answer: 'dim', unknown: 'dim' };

function draw(s) {
  f.clear();
  // the route to the victim, else the evacuation route Seraph computed on this plan
  const b = s.building, routes = s.routes || [];
  const route = routes.find(r => r.purpose === 'to_victim') || routes.find(r => r.purpose === 'evacuation' && r.path);
  const evac = route && route.purpose === 'evacuation';
  const level = route && route.path_level != null ? route.path_level : route ? +String(route.from).split(':')[1] || b.plan.level : b.plan.level;
  const points = (b.plan && b.plan.points) || [];
  const pt = name => (points.find(p => p.name === name) || {}).point;
  const end = route && (evac ? route.from : route.to);
  const target = end && end.startsWith('room:') ? end.split(':')[1] : null;
  const rooms = b.rooms.filter(r => r.level === level && r.zone);

  const plan = Halo.plan(f.svg, {
    zones: rooms.map(r => r.id === target
      ? { id: r.id, zone: r.zone, state: 'target', label: r.id, big: true, tap: { kind: 'room', id: r.id } }
      : { id: r.id, zone: r.zone, tap: { kind: 'room', id: r.id } }),
    points: points,
    box: Halo.AREA                                // the instruction card sits on the right
  });

  b.hazards.forEach(h => {
    const w = h.where;
    if (w.level !== undefined && w.level !== level) return;
    const room = w.room && rooms.find(r => r.id === w.room);
    const p = w.stair ? pt('stair:' + w.stair) : w.room === 'corridor' ? pt('corridor') : null;
    if (h.kind === 'fire' && room) {
      Halo.fire(f.svg, room.zone.map(q => plan.project(q)));
      Halo.warn(f.svg, plan.zone(room.id).c, { level: 'danger' });
    } else if (h.kind === 'smoke' && p) {
      const c = plan.project(p), r = w.stair ? 32 : 52;
      Halo.smoke(f.svg, { cx: c.x, cy: c.y, r: r });
      if (!w.stair) Halo.warn(f.svg, { x: c.x + r * 0.75, y: c.y - r * 0.7 }, { size: 32 });
    }
  });

  const arrival = (s.routes.find(r => r.purpose === 'approach') || { via: [] }).via.find(n => n.startsWith('stair:'));
  const node = id => id.startsWith('level:') ? pt(arrival) : id.startsWith('corridor') ? pt('corridor') : pt(id);
  if (route) {
    let pts = route.path ? route.path.map(p => plan.project(p)) : null;
    if (!pts) {
      const via = route.via.map(node).filter(Boolean).map(p => plan.project(p));
      pts = [via[0]];
      for (let i = 1; i < via.length; i++) {
        const a = via[i - 1], c = via[i];
        pts.push(route.via[i].startsWith('corridor') ? { x: a.x, y: c.y } : { x: c.x, y: a.y }, c);
      }
    }
    Halo.arrow(f.svg, pts, { gap: 22, source: route.source });
  }

  b.stairs.forEach(st => {
    const p = pt('stair:' + st.id); if (!p) return;
    const bad = st.status !== 'clear';
    Halo.marker(f.svg, 'stair', plan.project(p), st.id, { tone: bad ? 'warn' : 'ink', blink: bad, at: p.x > 500 ? 'e' : 'w',
      source: st.source, tap: { kind: 'stair', id: st.id } });
  });
  if (pt('riser')) Halo.marker(f.svg, 'riser', plan.project(pt('riser')), null, { r: 14 });
  if (pt('gas_cutoff')) Halo.marker(f.svg, 'gas', plan.project(pt('gas_cutoff')), null, { r: 14 });

  (s.occupants || []).filter(o => o.level === level && o.room).forEach(o => {
    const p = pt('room:' + o.room); if (!p) return;
    const kind = o.status === 'no_answer' || o.status === 'unknown' ? 'unknown' : o.mobility_issue ? 'wheelchair' : 'person';
    Halo.marker(f.svg, kind, plan.project(p), o.people_count > 1 ? o.people_count : null, {
      tone: TONE[o.status] || 'life', ping: o.room === target, source: o.source, tap: { kind: 'occupant', id: o.id } });
  });
  (s.crew.teams || []).filter(t => t.location && t.location.level === level && t.status === 'engaged').forEach(t => {
    const p = pt(t.location.room === 'corridor' ? 'corridor' : 'room:' + t.location.room); if (!p) return;
    Halo.marker(f.svg, 'team', plan.project(p), t.id, { at: 's', tap: { kind: 'team', id: t.id } });
  });

  // the card: where to go, how, what is in the way — one smoke line at most
  const here = b.hazards.filter(h => h.where.level === level);
  const where = h => h.where.room === 'corridor' ? 'circulation' : h.where.room || Halo.levelLabel(s, level);
  const smoke = here.filter(h => h.kind === 'smoke').sort((x, y) => (y.where.room ? 1 : 0) - (x.where.room ? 1 : 0))[0];
  const stair = route && (route.via.find(n => n.startsWith('stair:')) || arrival || '').split(':')[1];
  f.panel([
    target && { tone: evac ? 'ink' : 'life', text: (evac ? 'Évacuez ' : 'Allez en ') + target },
    stair && { text: 'Par esc. ' + stair },
    smoke && { tone: 'warn', text: 'Fumée ' + where(smoke) },
    ...here.filter(h => h.kind === 'fire').map(h => ({ tone: 'fire', text: 'Feu ' + h.where.room }))
  ]);
}

Halo.onState(draw);
Halo.ready();
</script>
</body>
</html>
