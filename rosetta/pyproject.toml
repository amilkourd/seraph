[project]
name = "rosetta"
version = "0.1.0"
description = "Seraph · Rosetta: computer use over screens without API (H Holo + Playwright)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openai>=1.50",
    "playwright>=1.48",
    "pydantic>=2.8",
    "pillow>=10.4",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
]

[project.scripts]
rosetta = "rosetta.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rosetta"]

[dependency-groups]
dev = ["pytest>=8"]
