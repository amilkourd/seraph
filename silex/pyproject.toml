[project]
name = "silex"
version = "0.1.0"
description = "Silex — tool creation with Devin: Halo views for the moment, learned Rosetta endpoints"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "playwright==1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["silex"]

[project.scripts]
silex = "silex.app:main"
