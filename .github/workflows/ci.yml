name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.module }} · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [seraph, registry, ifc]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Configure
        run: cp .env.example .env
      - name: Test
        working-directory: ${{ matrix.module }}
        run: uv run pytest -q

  web:
    name: ${{ matrix.app }} · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, talkie]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Generate route types
        working-directory: ${{ matrix.app }}
        run: npx next typegen
      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npm run typecheck
